<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Triangle Bell</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        min-width: 240px;
        min-height: 282px;
        background: #111827;
        color: #f9fafb;
        font-family: ui-rounded, system-ui, -apple-system, sans-serif;
      }
      main {
        width: 240px;
        height: 282px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 18px 16px 14px;
        text-align: center;
      }
      h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
      p { margin: 7px 0 0; color: #cbd5e1; font-size: 12px; }
      button {
        align-self: center;
        justify-self: center;
        width: 164px;
        height: 148px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      .triangle {
        width: 0;
        height: 0;
        margin: auto;
        border-left: 72px solid transparent;
        border-right: 72px solid transparent;
        border-bottom: 126px solid #ef4444;
        filter: drop-shadow(0 8px 8px rgb(0 0 0 / .28));
        transition: border-bottom-color .2s ease, transform .2s ease;
      }
      button:active .triangle { transform: scale(.93); }
      button[aria-pressed="true"] .triangle { border-bottom-color: #22c55e; }
      #status { font-weight: 700; color: #fca5a5; }
      button[aria-pressed="true"] + #status { color: #86efac; }
    </style>
  </head>
  <body>
    <main>
      <header><h1>Triangle Bell</h1><p>Tap the triangle to ring</p></header>
      <button id="triangleButton" type="button" aria-label="Red triangle" aria-pressed="false">
        <span class="triangle" aria-hidden="true"></span>
      </button>
      <p id="status" role="status">Red</p>
    </main>
    <script>
      const button = document.querySelector('#triangleButton');
      const status = document.querySelector('#status');

      function ringBell() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const context = new AudioContext();
        const now = context.currentTime;
        const output = context.createGain();
        output.gain.setValueAtTime(0.0001, now);
        output.gain.exponentialRampToValueAtTime(0.45, now + 0.012);
        output.gain.exponentialRampToValueAtTime(0.0001, now + 1.35);
        output.connect(context.destination);

        [1047, 1319, 1568, 2093].forEach((frequency, index) => {
          const tone = context.createOscillator();
          const gain = context.createGain();
          tone.type = 'sine';
          tone.frequency.setValueAtTime(frequency, now);
          gain.gain.setValueAtTime(0.34 / (index + 1), now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.25 - index * 0.08);
          tone.connect(gain).connect(output);
          tone.start(now);
          tone.stop(now + 1.4);
        });
        setTimeout(() => context.close(), 1600);
      }

      button.addEventListener('click', () => {
        const green = button.getAttribute('aria-pressed') === 'true';
        button.setAttribute('aria-pressed', String(!green));
        button.setAttribute('aria-label', green ? 'Red triangle' : 'Green triangle');
        status.textContent = green ? 'Red' : 'Green';
        ringBell();
      });
    </script>
  </body>
</html>
