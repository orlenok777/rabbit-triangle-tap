<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Пей воду</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        min-width: 240px;
        min-height: 282px;
        background: #0f172a;
        color: #f8fafc;
        font-family: ui-rounded, system-ui, -apple-system, sans-serif;
      }
      body.flash { animation: reminderFlash 1.35s ease-in-out; }
      @keyframes reminderFlash {
        0%, 100% { background: #0f172a; }
        18% { background: #7c3aed; }
        40% { background: #0ea5e9; }
        62% { background: #16a34a; }
        80% { background: #f97316; }
      }
      main { width: 240px; height: 282px; padding: 14px 14px 12px; text-align: center; }
      h1 { margin: 0; font-size: 21px; }
      .hint { margin: 3px 0 10px; color: #bfdbfe; font-size: 11px; }
      #waterButton {
        width: 100%; padding: 13px 8px; border: 0; border-radius: 14px;
        background: #0ea5e9; color: white; font: inherit; font-size: 20px;
        font-weight: 800; cursor: pointer; box-shadow: 0 5px 12px rgb(14 165 233 / .25);
      }
      #waterButton.running { background: #16a34a; }
      .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin: 9px 0 7px; }
      .choice {
        border: 1px solid #334155; border-radius: 9px; padding: 8px 3px;
        color: #cbd5e1; background: #1e293b; font: inherit; font-size: 11px; cursor: pointer;
      }
      .choice.selected { background: #0369a1; border-color: #38bdf8; color: white; font-weight: 700; }
      .repeat-label { margin: 0 0 4px; color: #cbd5e1; font-size: 11px; }
      .repeats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
      .repeat { padding: 6px 1px; border: 1px solid #334155; border-radius: 7px; background: #1e293b; color: #cbd5e1; font: inherit; font-size: 10px; }
      .repeat.selected { background: #7c3aed; border-color: #c4b5fd; color: white; font-weight: 700; }
      #status { min-height: 30px; margin: 5px 0 0; color: #e2e8f0; font-size: 12px; line-height: 1.35; }
      .actions { display: flex; justify-content: center; gap: 10px; margin-top: 6px; }
      #stopButton, #testButton { border: 0; background: transparent; font: inherit; font-size: 11px; cursor: pointer; }
      #stopButton { color: #fca5a5; }
      #testButton { color: #fde68a; }
      #stopButton[hidden] { display: none; }
      #countdown { min-height: 22px; margin: 4px 0 0; color: #7dd3fc; font-size: 16px; font-weight: 800; }
      #waterButton.pulse { animation: pulse 1.35s ease-in-out infinite; }
      @keyframes pulse { 50% { transform: scale(1.035); box-shadow: 0 0 24px rgb(56 189 248 / .9); } }
    </style>
  </head>
  <body>
    <main>
      <h1>Напоминатель</h1>
      <p class="hint">Выбери интервал, затем нажми кнопку</p>
      <button id="waterButton" type="button" aria-pressed="false">Пей воду</button>
      <div class="choices" aria-label="Интервал напоминания">
        <button class="choice" data-minutes="60">Каждый час</button>
        <button class="choice" data-minutes="30">30 минут</button>
        <button class="choice" data-minutes="10">10 минут</button>
        <button class="choice" data-minutes="5">5 минут</button>
        <button class="choice" data-minutes="1">1 минута</button>
      </div>
      <p class="repeat-label">Повторить «Пей воду»</p>
      <div class="repeats" aria-label="Количество повторов">
        <button class="repeat" data-repeats="1">1 раз</button>
        <button class="repeat" data-repeats="3">3 раза</button>
        <button class="repeat" data-repeats="5">5 раз</button>
        <button class="repeat" data-repeats="10">10 раз</button>
      </div>
      <p id="status" role="status">Интервал: каждый час</p>
      <p id="countdown" aria-live="polite">Выбери интервал</p>
      <div class="actions">
        <button id="testButton" type="button">Проверить сейчас</button>
        <button id="stopButton" type="button" hidden>Остановить</button>
      </div>
    </main>
    <script>
      const waterButton = document.querySelector('#waterButton');
      const status = document.querySelector('#status');
      const stopButton = document.querySelector('#stopButton');
      const testButton = document.querySelector('#testButton');
      const countdown = document.querySelector('#countdown');
      const choices = [...document.querySelectorAll('.choice')];
      const repeatChoices = [...document.querySelectorAll('.repeat')];
      let minutes = 60;
      let repeats = 1;
      let timer = null;
      let countdownTimer = null;
      let nextReminderAt = 0;

      function labelFor(value) {
        return ({ 60: 'каждый час', 30: 'каждые 30 минут', 10: 'каждые 10 минут', 5: 'каждые 5 минут', 1: 'каждую минуту' })[value];
      }

      function ringBell() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const context = new AudioContext();
        const now = context.currentTime;
        const output = context.createGain();
        output.gain.setValueAtTime(0.0001, now);
        output.gain.exponentialRampToValueAtTime(0.42, now + 0.012);
        output.gain.exponentialRampToValueAtTime(0.0001, now + 1.35);
        output.connect(context.destination);
        [1047, 1319, 1568, 2093].forEach((frequency, index) => {
          const tone = context.createOscillator();
          const gain = context.createGain();
          tone.type = 'sine'; tone.frequency.setValueAtTime(frequency, now);
          gain.gain.setValueAtTime(0.34 / (index + 1), now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.25 - index * 0.08);
          tone.connect(gain).connect(output); tone.start(now); tone.stop(now + 1.4);
        });
        setTimeout(() => context.close(), 1600);
      }

      function flashScreen() {
        document.body.classList.remove('flash');
        void document.body.offsetWidth;
        document.body.classList.add('flash');
      }

      function playRecorded(source, count = 1) {
        let remaining = count;
        const playNext = () => {
          if (remaining-- <= 0) return;
          const audio = new Audio(source);
          audio.onended = playNext;
          audio.play().catch(() => {});
        };
        playNext();
      }

      function speak(text, count = 1) {
        playRecorded(text.startsWith('Я буду') ? welcomeVoice : drinkVoice, count);
      }

      function remind() {
        ringBell();
        flashScreen();
        speak('Пей воду', repeats);
        status.textContent = 'Пора пить воду! ' + repeats + '×, ' + labelFor(minutes);
        nextReminderAt = Date.now() + minutes * 60 * 1000;
        updateCountdown();
      }

      function greet() {
        status.textContent = 'Выбери интервал и нажми «Пей воду»';
      }

      function updateCountdown() {
        if (!timer) return;
        const seconds = Math.max(0, Math.ceil((nextReminderAt - Date.now()) / 1000));
        const mins = Math.floor(seconds / 60);
        const secs = String(seconds % 60).padStart(2, '0');
        countdown.textContent = 'Следующее через ' + mins + ':' + secs;
      }

      function start() {
        clearInterval(timer);
        waterButton.classList.add('running');
        waterButton.classList.add('pulse');
        waterButton.setAttribute('aria-pressed', 'true');
        stopButton.hidden = false;
        status.textContent = 'Напоминаю ' + labelFor(minutes);
        flashScreen();
        speak('Я буду напоминать тебе пить воду');
        nextReminderAt = Date.now() + minutes * 60 * 1000;
        clearInterval(countdownTimer);
        countdownTimer = setInterval(updateCountdown, 1000);
        updateCountdown();
        timer = setInterval(remind, minutes * 60 * 1000);
      }

      function stop() {
        clearInterval(timer); clearInterval(countdownTimer); timer = null;
        window.speechSynthesis?.cancel();
        waterButton.classList.remove('running');
        waterButton.classList.remove('pulse');
        waterButton.setAttribute('aria-pressed', 'false');
        stopButton.hidden = true;
        status.textContent = 'Таймер остановлен';
        countdown.textContent = 'Выбери интервал';
      }

      choices.forEach(choice => choice.addEventListener('click', () => {
        minutes = Number(choice.dataset.minutes);
        choices.forEach(item => item.classList.toggle('selected', item === choice));
        if (timer) start(); else status.textContent = 'Интервал: ' + labelFor(minutes);
      }));
      repeatChoices.forEach(choice => choice.addEventListener('click', () => {
        repeats = Number(choice.dataset.repeats);
        repeatChoices.forEach(item => item.classList.toggle('selected', item === choice));
        if (timer) status.textContent = 'Повторяю ' + repeats + ' раз, ' + labelFor(minutes);
      }));
      waterButton.addEventListener('click', () => timer ? stop() : start());
      stopButton.addEventListener('click', stop);
      testButton.addEventListener('click', remind);
      choices[0].classList.add('selected');
      repeatChoices[0].classList.add('selected');
      setTimeout(greet, 250);
    </script>
